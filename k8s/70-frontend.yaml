apiVersion: v1
kind: Service
metadata:
  name: frontendv2
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: frontendv2
    app.kubernetes.io/part-of: log-beacon
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: frontendv2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontendv2
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: frontendv2
    app.kubernetes.io/part-of: log-beacon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontendv2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontendv2
        app.kubernetes.io/part-of: log-beacon
    spec:
      containers:
        - name: frontendv2
          image: log-beacon-frontendv2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: log-beacon-config
  namespace: log-beacon
  labels:
    app.kubernetes.io/part-of: log-beacon
data:
  NATS_URL: "nats://nats.log-beacon.svc.cluster.local:4222"
  HOT_STORAGE_URL: "http://hot-storage.log-beacon.svc.cluster.local:8081"
  MINIO_ENDPOINT: "minio.log-beacon.svc.cluster.local:9000"
  POSTGRES_USER: "logbeacon"
  POSTGRES_DB: "logbeacon_auth"
  DB_URL: "postgres://logbeacon:logbeacon@postgres.log-beacon.svc.cluster.local:5432/logbeacon_auth?sslmode=disable"
  MINIO_ACCESS_KEY_ID: "minioadmin"
  ARCHIVE_BATCH_SIZE: "5000"
  ARCHIVE_FLUSH_INTERVAL: "30s"
  HOT_STORAGE_RETENTION: "24h"
  HOT_STORAGE_PURGE_INTERVAL: "30m"
---
apiVersion: v1
kind: Secret
metadata:
  name: log-beacon-secrets
  namespace: log-beacon
  labels:
    app.kubernetes.io/part-of: log-beacon
type: Opaque
stringData:
  POSTGRES_PASSWORD: "logbeacon"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  MINIO_SECRET_ACCESS_KEY: "minioadmin"
  JWT_SECRET: "log-beacon-secret-key-change-in-production"

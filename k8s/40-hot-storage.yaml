apiVersion: v1
kind: Service
metadata:
  name: hot-storage
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: hot-storage
    app.kubernetes.io/part-of: log-beacon
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: hot-storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hot-storage
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: hot-storage
    app.kubernetes.io/part-of: log-beacon
spec:
  serviceName: hot-storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hot-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hot-storage
        app.kubernetes.io/part-of: log-beacon
    spec:
      containers:
        - name: hot-storage
          image: log-beacon:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/hot-storage"]
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: log-beacon-config
                  key: NATS_URL
            - name: HOT_STORAGE_RETENTION
              valueFrom:
                configMapKeyRef:
                  name: log-beacon-config
                  key: HOT_STORAGE_RETENTION
            - name: HOT_STORAGE_PURGE_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: log-beacon-config
                  key: HOT_STORAGE_PURGE_INTERVAL
          volumeMounts:
            - name: hot-storage-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: hot-storage-data
        labels:
          app.kubernetes.io/name: hot-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi

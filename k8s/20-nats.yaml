apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: log-beacon
spec:
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: cluster
      port: 6222
      targetPort: 6222
    - name: monitor
      port: 8222
      targetPort: 8222
  selector:
    app.kubernetes.io/name: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: log-beacon
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: log-beacon
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: log-beacon
    spec:
      containers:
        - name: nats
          image: nats:2.10.14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "nats-server"
            - "-js"
            - "-sd"
            - "/data/jetstream"
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: nats-data
              mountPath: /data/jetstream
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: nats-data
        labels:
          app.kubernetes.io/name: nats
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
